name: Build Test

on:
  push:
    branches:
      - "1.21.*"
    tags:
      - "!*"
  pull_request:
    branches:
      - "1.21.*"

jobs:
  check-forge:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      DISABLE_NEO_FORGE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set executable
        run: chmod +x ./gradlew
      - name: Get cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: ./gradlew data
      - run: ./gradlew test build publishToMavenLocal
      - name: Prepare example runs
        run: |
          set -eux
          for d in example/*; do
            mkdir -p "$d/run"
          done
          ls example/*
      - name: Check examples
        run: ./gradlew runGameTestServer --stacktrace || ./gradlew runGameTestServer --stacktrace
      - name: Check examples with runData
        run: ./gradlew runData --stacktrace || ./gradlew runData --stacktrace
      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          path: '*/build/libs/*'
          name: '${{ github.event.repository.name }}-Forge-${{ github.run_number }}'
          retention-days: 3

  check-neoforge:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      DISABLE_FORGE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set executable
        run: chmod +x ./gradlew
      - name: Get cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: ./gradlew data --stacktrace
      - run: ./gradlew test build publishToMavenLocal
      - name: Prepare example runs
        run: |
          set -eux
          for d in example/*; do
            mkdir -p "$d/run"
          done
          ls example/*
      - name: Check examples
        run: ./gradlew runGameTestServer --stacktrace || ./gradlew runGameTestServer --stacktrace
      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          path: '*/build/libs/*'
          name: '${{ github.event.repository.name }}-NeoForge-${{ github.run_number }}'
          retention-days: 3
