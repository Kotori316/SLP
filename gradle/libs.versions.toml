forge1214 = "1.21.4-54.1.8"
forge1215 = "1.21.5-55.1.2"
forge1216 = "1.21.6-56.0.9"
forge1219 = "1.21.10-60.0.10"
neoforge = "21.1.212"
neo1213 = "21.3.93"
neo1214 = "21.4.155"
neo1215 = "21.5.95"
neo1216 = "21.6.20-beta"
neo1219 = "21.10.29-beta"
# https://ldtteam.jfrog.io/ui/native/parchmentmc-public/org/parchmentmc/data/
# https://github.com/ParchmentMC/Parchment
parchment = "1.21.1-2024.11.17"
parchment1216 = "1.21.6-2025.06.29-1.21.6"
# https://mvnrepository.com/artifact/org.scala-lang/scala-library
scala2 = "2.13.17"
# https://mvnrepository.com/artifact/org.scala-lang/scala3-library
scala3 = "3.7.3"
cats = "2.13.0-kotori"
# https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
jupiter = "6.0.0"
# https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
jupiter-platform = "6.0.0"
mockito-core = "5.20.0"
mockito-inline = "5.2.0"

plugin_cf = "3.4"
plugin_shadow = "9.2.2"
plugin_idea_ext = "1.3"
plugin_ghr = "2.5.2"
plugin_publish_all = "1.+"
plugin_forge_gradle = "[6.0.24,6.2)"
plugin_parchment_librarian = "1.+"
plugin_neoforge_userdev = "7.1.0"
plugin_neoforge_moddev = "2.0.115"

[libraries]
scala2 = { group = "org.scala-lang", name = "scala-library", version.ref = "scala2" }
scala3 = { group = "org.scala-lang", name = "scala3-library_3", version.ref = "scala3" }
cats-kernel = { group = "org.typelevel", name = "cats-kernel_3", version.ref = "cats" }
cats-core = { group = "org.typelevel", name = "cats-core_3", version.ref = "cats" }
cats-free = { group = "org.typelevel", name = "cats-free_3", version.ref = "cats" }
jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "jupiter" }
jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "jupiter" }
jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "jupiter" }
jupiter-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "jupiter-platform" }
mockito_core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito-core" }
mockito_inline = { group = "org.mockito", name = "mockito-inline", version.ref = "mockito-inline" }
forge = { group = "net.minecraftforge", name = "forge", version.ref = "forge" }
forge1213 = { group = "net.minecraftforge", name = "forge", version.ref = "forge1213" }
forge1214 = { group = "net.minecraftforge", name = "forge", version.ref = "forge1214" }
forge1215 = { group = "net.minecraftforge", name = "forge", version.ref = "forge1215" }
forge1216 = { group = "net.minecraftforge", name = "forge", version.ref = "forge1216" }
forge1219 = { group = "net.minecraftforge", name = "forge", version.ref = "forge1219" }
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
neo1213 = { group = "net.neoforged", name = "neoforge", version.ref = "neo1213" }
neo1214 = { group = "net.neoforged", name = "neoforge", version.ref = "neo1214" }
neo1215 = { group = "net.neoforged", name = "neoforge", version.ref = "neo1215" }
neo1216 = { group = "net.neoforged", name = "neoforge", version.ref = "neo1216" }
neo1219 = { group = "net.neoforged", name = "neoforge", version.ref = "neo1219" }

[plugins]
cf = { id = "com.kotori316.plugin.cf", version.ref = "plugin_cf" }
shadow = { id = "com.gradleup.shadow", version.ref = "plugin_shadow" }
idea = { id = "org.jetbrains.gradle.plugin.idea-ext", version.ref = "plugin_idea_ext" }
ghr = { id = "com.github.breadmoirai.github-release", version.ref = "plugin_ghr" }
publish-all = { id = "me.modmuss50.mod-publish-plugin", version.ref = "plugin_publish_all" }
forge-gradle = { id = "net.minecraftforge.gradle", version.ref = "plugin_forge_gradle" }
parchment-librarian = { id = "org.parchmentmc.librarian.forgegradle", version.ref = "plugin_parchment_librarian" }
neoforge-userdev = { id = "net.neoforged.gradle.userdev", version.ref = "plugin_neoforge_userdev" }
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "plugin_neoforge_moddev" }

[bundles]
cats = ["cats-kernel", "cats-core", "cats-free"]
